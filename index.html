<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - You vs Computer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="container" id="container">
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">You (<span class="x-mark">X</span>) vs Computer (<span class="o-mark">O</span>)</p>

        <div class="scoreboard">
            <div class="score score-you">
                <span class="score-label">You</span>
                <span class="score-value" id="score-you">0</span>
            </div>
            <div class="score score-draws">
                <span class="score-label">Draws</span>
                <span class="score-value" id="score-draws">0</span>
            </div>
            <div class="score score-cpu">
                <span class="score-label">CPU</span>
                <span class="score-value" id="score-cpu">0</span>
            </div>
        </div>

        <div class="difficulty">
            <button class="diff-btn" data-diff="easy">Easy</button>
            <button class="diff-btn active" data-diff="medium">Medium</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <div class="status" id="status">Your turn!</div>
        <button class="restart" id="restart">Restart Game</button>
    </div>

    <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
            <div id="overlay-emoji" class="overlay-emoji">🎉</div>
            <div id="overlay-title" class="overlay-title">YOU WIN!</div>
            <div id="overlay-subtitle" class="overlay-subtitle">Amazing!</div>
            <button id="play-again">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
